      operationId: importResults
      summary: >-
        Bulk-import externally-run test results from a JUnit XML report,
        matching each reported test to an existing case by its key
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: Every reported test matched an existing case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "207":
          description: Import succeeded but one or more tests had no matching case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
