openapi: 3.0.3
info:
  title: TestPulse API
  description: >
    The TestPulse REST API. This contract is the single source of truth
    consumed by the web UI (generated TypeScript client), MCP tooling, and
    external integrations.
  version: 0.0.1
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
servers:
  - url: /
    description: Same-origin deployment
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Reports process health only; independent of dependency state.
      tags: [system]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >
        Reports dependency health: database reachable and schema migrations
        current.
      tags: [system]
      responses:
        "200":
          description: Service is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Service metadata
      tags: [system]
      responses:
        "200":
          description: Service name and version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags: [projects]
      responses:
        "200":
          description: All projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/projects/summaries:
    get:
      operationId: listProjectSummaries
      summary: Suite/case counts and latest-run pass rate for every non-archived project, in one request
      tags: [projects]
      responses:
        "200":
          description: One summary per non-archived project
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
  /api/v1/projects/{projectKey}:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      summary: Rename, describe, or archive a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/favorite:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    post:
      operationId: starProject
      summary: Star a project for the calling user
      tags: [projects]
      responses:
        "204": { description: Project is now favorited by the caller }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unstarProject
      summary: Unstar a project for the calling user
      tags: [projects]
      responses:
        "204": { description: Project is no longer favorited by the caller }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/projects/{projectKey}/cases:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCases
      summary: List test cases in a project
      tags: [cases]
      responses:
        "200":
          description: Cases with their current version content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TestCase" }
    post:
      operationId: createCase
      summary: Create a test case (version 1). Defaults into the project's root folder.
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseCreateInput" }
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/folders:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFolders
      summary: List all folders in a project (flat; reconstruct the tree from parentFolderId)
      tags: [folders]
      responses:
        "200":
          description: Folders, including the project's root folder
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Folder" }
    post:
      operationId: createFolder
      summary: Create a subfolder (a parent folder is always required)
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFolder" }
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/folders/{folderId}:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteFolder
      summary: Delete a folder, reparenting its child folders and cases to its parent
      tags: [folders]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cases/{caseKey}/folder:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    put:
      operationId: moveCase
      summary: Move a case to a different folder (suite membership is unaffected)
      tags: [cases, folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folderId]
              properties:
                folderId: { type: string }
      responses:
        "204": { description: Moved }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cases/{caseKey}:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCase
      summary: Get a case at its current version
      tags: [cases]
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: editCase
      summary: Edit a case (creates a new immutable version)
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseContent" }
      responses:
        "200":
          description: Case at its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCase
      summary: Soft-delete a case (versions stay readable in runs)
      tags: [cases]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cases/{caseKey}/versions:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCaseVersions
      summary: Full version history of a case
      tags: [cases]
      responses:
        "200":
          description: All versions, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseVersion" }
  /api/v1/cases/{caseKey}/executions:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCaseExecutions
      summary: Every execution that has pinned this case, across all runs, grouped by version
      tags: [cases]
      responses:
        "200":
          description: Executions ordered by pinned version, then by when they ran
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseExecution" }
  /api/v1/projects/{projectKey}/suites:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSuites
      summary: List suites in a project
      tags: [suites]
      responses:
        "200":
          description: Suites with case membership
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Suite" }
    post:
      operationId: createSuite
      summary: Create a suite
      tags: [suites]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuiteInput" }
      responses:
        "201":
          description: Created suite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suite" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/suites/{suiteKey}/cases/{caseKey}:
    parameters:
      - { name: suiteKey, in: path, required: true, schema: { type: string } }
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    put:
      operationId: addCaseToSuite
      summary: Add a case to a suite (n:m)
      tags: [suites]
      responses:
        "204": { description: Added }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeCaseFromSuite
      summary: Remove a case from a suite (case itself survives)
      tags: [suites]
      responses:
        "204": { description: Removed }
  /api/v1/projects/{projectKey}/runs:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRuns
      summary: List runs in a project
      tags: [runs]
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
    post:
      operationId: createRun
      summary: Create a run, pinning each case's current version
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunInput" }
      responses:
        "201":
          description: Created run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/runs/{runKey}:
    parameters:
      - { name: runKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRun
      summary: Get a run
      tags: [runs]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/runs/{runKey}/items:
    parameters:
      - { name: runKey, in: path, required: true, schema: { type: string } }
      - { name: assignee, in: query, required: false, schema: { type: string } }
    get:
      operationId: listRunItems
      summary: List run items with pinned content, optionally by assignee
      tags: [runs]
      responses:
        "200":
          description: Run items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunItem" }
    post:
      operationId: addRunItem
      summary: Add a case to an open run (pins its then-current version)
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddItemInput" }
      responses:
        "201":
          description: Created run item id
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties: { id: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/items/{itemId}/results:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listResults
      summary: Append-only result log of a run item
      tags: [runs]
      responses:
        "200":
          description: Results, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Result" }
    post:
      operationId: recordResult
      summary: Record a verdict (appends to log, updates item status)
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewResult" }
      responses:
        "201":
          description: Recorded result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Result" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/items/{itemId}/status:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateItemStatus
      summary: Set item status (e.g. retest) or assignee
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemStatusUpdate" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/runs/{runKey}/summary:
    parameters:
      - { name: runKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRunSummary
      summary: Item counts by status
      tags: [runs]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password, starting a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated; a session cookie is set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204": { description: Logged out }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List all users
      tags: [users]
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createUser
      summary: Create a user (Tenant Admin only)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: The currently authenticated actor, as a user record
      tags: [users]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateUser
      summary: Change a user's Tenant Admin flag, deactivate, or reactivate them (Tenant Admin only)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: List API tokens (own tokens, or another user's via userId — Tenant Admin only)
      tags: [tokens]
      parameters:
        - name: userId
          in: query
          schema: { type: string }
          description: Omit to list the caller's own tokens.
      responses:
        "200":
          description: Tokens (never the full secret value, only name and prefix)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createToken
      summary: Create an API token for an agent — the full value is returned once and never again
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "201":
          description: Created token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeToken
      summary: Revoke a token (its own creator, or a Tenant Admin)
      tags: [tokens]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/audit:
    get:
      operationId: listAuditEntries
      summary: Audit history for a specific entity, oldest first
      tags: [audit]
      parameters:
        - { name: entityType, in: query, required: true, schema: { type: string } }
        - { name: entityId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Audit entries for the entity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/teams:
    get:
      operationId: listTeams
      summary: List teams
      tags: [teams]
      responses:
        "200":
          description: All teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTeam
      summary: Create a team (Tenant Admin only)
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/teams/{teamId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: renameTeam
      summary: Rename a team (Tenant Admin only)
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamUpdate" }
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTeam
      summary: Delete a team (Tenant Admin only) — removes its membership and project role assignments
      tags: [teams]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teams/{teamId}/members/{userId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      operationId: addTeamMember
      summary: Add a user to a team (Tenant Admin only)
      tags: [teams]
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeTeamMember
      summary: Remove a user from a team (Tenant Admin only)
      tags: [teams]
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List all roles (add-project-rbac design.md D10 — fully custom, instance-wide)
      tags: [roles]
      responses:
        "200":
          description: All roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRole
      summary: Create a role (Tenant Admin only)
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/roles/reset:
    post:
      operationId: resetRolesToDefaults
      summary: >-
        Restore Tester/Contributor/Project Admin to their factory permission
        flags (Tenant Admin only). Selective, not a wipe (design.md D12): an
        existing role with one of these three names is updated in place
        (same id — every project/team assignment referencing it stays
        valid); a missing one is recreated. Every other role, and every
        assignment anywhere in the instance, is left untouched.
      tags: [roles]
      responses:
        "200":
          description: The three resulting default roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/roles/{roleId}:
    parameters:
      - { name: roleId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateRole
      summary: Update a role's name, rank, or permission flags (Tenant Admin only)
      tags: [roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRole
      summary: >-
        Delete a role (Tenant Admin only). Any project membership or team
        role assignment referencing it is removed too (CASCADE) — users
        whose access depended solely on this role lose it immediately.
      tags: [roles]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/members:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectMembership
      summary: List a project's directly-assigned users and assigned teams, each with their role
      tags: [projects]
      responses:
        "200":
          description: The project's membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/members/{userId}:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setProjectMember
      summary: Assign a user a role on a project, or change it (Tenant Admin only)
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRoleInput" }
      responses:
        "204": { description: Assigned }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeProjectMember
      summary: Remove a user's direct role assignment on a project (Tenant Admin only)
      tags: [projects]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/teams/{teamId}:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
      - { name: teamId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setProjectTeamRole
      summary: Assign a team a role on a project, or change it (Tenant Admin only)
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRoleInput" }
      responses:
        "204": { description: Assigned }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeProjectTeamRole
      summary: Remove a team's role assignment on a project (Tenant Admin only)
      tags: [projects]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  responses:
    ValidationError:
      description: Invalid input; the message names the offending field
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Entity does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not permitted to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Status:
      type: string
      enum: [pending, pass, failed, skipped, blocked, retest]
    Verdict:
      type: string
      enum: [pass, failed, skipped, blocked]
    Priority:
      type: string
      enum: [low, medium, high, critical]
    Step:
      type: object
      required: [action]
      properties:
        action: { type: string }
        expected: { type: string }
    CaseContent:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        expectedResult: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        tags:
          type: array
          items: { type: string }
        platform:
          type: string
          description: Free text — target platform (e.g. "web", "iOS"). No fixed taxonomy.
        testType:
          type: string
          description: Free text — kind of test (e.g. "unit", "e2e"). No fixed taxonomy.
        automated:
          type: boolean
          description: Defaults to false — every case is manual until marked otherwise.
    CaseCreateInput:
      allOf:
        - $ref: "#/components/schemas/CaseContent"
        - type: object
          properties:
            folderId:
              type: string
              description: Defaults to the project's root folder when omitted.
    Folder:
      type: object
      required: [id, projectId, name, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        parentFolderId:
          type: string
          description: Absent for a project's root folder.
        name: { type: string }
        createdAt: { type: string, format: date-time }
    NewFolder:
      type: object
      required: [name, parentFolderId]
      properties:
        name: { type: string }
        parentFolderId:
          type: string
          description: Required — only the root folder (auto-created with the project) may have no parent.
    Project:
      type: object
      required: [id, key, name, archived, description, createdAt]
      properties:
        id: { type: string }
        key:
          type: string
          description: Short, unique, human-readable identifier auto-derived from the project's name at creation. Immutable.
        name: { type: string }
        archived: { type: boolean }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }
    TestCase:
      type: object
      required: [id, key, projectId, folderId, currentVersion, content, createdAt]
      properties:
        id: { type: string }
        key:
          type: string
          description: "Human-readable identifier, scoped to the project: {projectKey}-{n}. Immutable."
        projectId: { type: string }
        folderId: { type: string }
        currentVersion: { type: integer }
        content: { $ref: "#/components/schemas/CaseContent" }
        createdAt: { type: string, format: date-time }
    CaseVersion:
      type: object
      required: [caseId, version, content, createdAt]
      properties:
        caseId: { type: string }
        version: { type: integer }
        content: { $ref: "#/components/schemas/CaseContent" }
        createdAt: { type: string, format: date-time }
    CaseExecution:
      type: object
      required: [runItemId, runId, runName, caseVersion, status, createdAt]
      properties:
        runItemId: { type: string }
        runId: { type: string }
        runName: { type: string }
        caseVersion: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
    Suite:
      type: object
      required: [id, key, projectId, name, caseIds, createdAt]
      properties:
        id: { type: string }
        key:
          type: string
          description: "Human-readable identifier, scoped to the project: {projectKey}-S{n}. Immutable."
        projectId: { type: string }
        name: { type: string }
        caseIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    SuiteInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Run:
      type: object
      required: [id, key, projectId, projectKey, name, createdAt]
      properties:
        id: { type: string }
        key:
          type: string
          description: "Human-readable identifier, scoped to the project: {projectKey}-R{n}. Immutable."
        projectId: { type: string }
        projectKey:
          type: string
          description: The owning project's key — a run's own route isn't nested under its project's, so this lets a client link back without a second lookup.
        name: { type: string }
        createdAt: { type: string, format: date-time }
    RunInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        suiteKey:
          type: string
          description: Include all cases of this suite
        caseKeys:
          type: array
          items: { type: string }
          description: Explicit cases to include
    RunItem:
      type: object
      required: [id, runId, caseId, caseVersion, assignee, currentStatus, content, newerVersion, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        caseId: { type: string }
        caseVersion: { type: integer }
        assignee: { type: string }
        currentStatus: { $ref: "#/components/schemas/Status" }
        content:
          allOf: [{ $ref: "#/components/schemas/CaseContent" }]
          description: Content of the pinned version, not the current one
        newerVersion:
          type: boolean
          description: True when the case has a newer version than the pinned one
        createdAt: { type: string, format: date-time }
    AddItemInput:
      type: object
      required: [caseKey]
      properties:
        caseKey: { type: string }
    NewResult:
      type: object
      required: [actor, verdict]
      properties:
        actor: { type: string }
        verdict: { $ref: "#/components/schemas/Verdict" }
        comment: { type: string }
    Result:
      type: object
      required: [id, runItemId, actor, verdict, comment, createdAt]
      properties:
        id: { type: string }
        runItemId: { type: string }
        actor: { type: string }
        verdict: { $ref: "#/components/schemas/Verdict" }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
    ItemStatusUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/Status" }
        assignee: { type: string }
    RunSummary:
      type: object
      required: [runId, total, counts]
      properties:
        runId: { type: string }
        total: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
    ProjectSummary:
      type: object
      required: [projectId, suiteCount, caseCount, passRate, lastRunAt, isFavorite]
      properties:
        projectId: { type: string }
        suiteCount: { type: integer }
        caseCount: { type: integer }
        passRate:
          type: integer
          nullable: true
          description: From the project's most recently created run only; null if it has no runs yet.
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          description: When the project's most recently created run was started; null if it has no runs yet.
        isFavorite:
          type: boolean
          description: Whether the calling user has starred this project.
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        reason:
          type: string
          description: Present when status is "unavailable".
    Meta:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: TestPulse
        version:
          type: string
          example: 0.0.1
    User:
      type: object
      required: [id, email, isTenantAdmin, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        isTenantAdmin: { type: boolean }
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
    UserInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        isTenantAdmin: { type: boolean, default: false }
    UserUpdate:
      type: object
      properties:
        isTenantAdmin: { type: boolean }
        deactivate:
          type: boolean
          description: Set true to deactivate the user.
        reactivate:
          type: boolean
          description: Set true to reactivate a previously-deactivated user.
    Role:
      type: object
      description: >-
        A fully custom, instance-wide role (add-project-rbac design.md D10):
        the Tenant Admin creates/renames/deletes roles and toggles their
        permission flags freely. A user's effective permissions on a project
        are the union of every role granted to them directly or via a team
        (not a single "highest" role — there is no fixed ranking). Ten
        concrete, per-resource flags (design.md D11) rather than a handful
        of broad ones — e.g. caseCreate is independent of caseDelete.
      required:
        [id, name, rank, canRead, canCaseCreate, canCaseEdit, canCaseDelete,
         canSectionCreate, canSectionDelete, canSuiteCreate, canSuiteEditMembership,
         canRunCreate, canRunRecordResult, canManageProject, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        rank:
          type: integer
          description: Tenant-Admin-set display/sort order only — never compared for authorization.
        canRead: { type: boolean }
        canCaseCreate: { type: boolean }
        canCaseEdit: { type: boolean }
        canCaseDelete: { type: boolean }
        canSectionCreate: { type: boolean }
        canSectionDelete: { type: boolean }
        canSuiteCreate: { type: boolean }
        canSuiteEditMembership: { type: boolean }
        canRunCreate: { type: boolean }
        canRunRecordResult: { type: boolean }
        canManageProject: { type: boolean }
        createdAt: { type: string, format: date-time }
    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        rank: { type: integer }
        canRead: { type: boolean }
        canCaseCreate: { type: boolean }
        canCaseEdit: { type: boolean }
        canCaseDelete: { type: boolean }
        canSectionCreate: { type: boolean }
        canSectionDelete: { type: boolean }
        canSuiteCreate: { type: boolean }
        canSuiteEditMembership: { type: boolean }
        canRunCreate: { type: boolean }
        canRunRecordResult: { type: boolean }
        canManageProject: { type: boolean }
    Team:
      type: object
      required: [id, name, memberIds, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        memberIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    TeamUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    ProjectMember:
      type: object
      required: [userId, roleId]
      properties:
        userId: { type: string }
        roleId: { type: string }
    ProjectTeamRole:
      type: object
      required: [teamId, roleId]
      properties:
        teamId: { type: string }
        roleId: { type: string }
    ProjectMembership:
      type: object
      required: [users, teams]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/ProjectMember" }
        teams:
          type: array
          items: { $ref: "#/components/schemas/ProjectTeamRole" }
    ProjectRoleInput:
      type: object
      required: [roleId]
      properties:
        roleId: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    ApiToken:
      type: object
      required: [id, createdBy, name, prefix, createdAt]
      properties:
        id: { type: string }
        createdBy: { type: string }
        name: { type: string }
        prefix:
          type: string
          description: Short, non-secret prefix of the token, for identification only.
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The full secret token value. Shown only in this response, never again.
    TokenInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    ActorKind:
      type: string
      enum: [user, agent]
    AuditEntry:
      type: object
      required: [id, actorKind, actorId, actorName, action, entityType, entityId, occurredAt]
      properties:
        id: { type: string }
        actorKind: { $ref: "#/components/schemas/ActorKind" }
        actorId: { type: string }
        actorName: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        occurredAt: { type: string, format: date-time }
