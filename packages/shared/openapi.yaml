      - { name: projectKey, in: path, required: true, schema: { type: string } }
    post:
      operationId: createImportJob
      summary: >-
        Start a structural import job (cases/folders) from an external
        source such as TestRail — requires the manageProject permission.
        Deliberately a distinct resource from POST .../imports (synchronous
        JUnit-XML result import): add-testrail-importer design.md D3
        correction, found before implementing, since that path was already
        taken.
      tags: [importJobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewImportJob" }
      responses:
        "201":
          description: Job created, pending an importer to claim it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listImportJobs
      summary: >-
        List every import job ever created for a project, newest first —
        requires the manageProject permission. The primitive that makes an
        abandoned or failed import discoverable
        (fix-import-wizard-orphaned-projects design.md D3).
      tags: [importJobs]
      responses:
        "200":
          description: The project's import jobs, newest first
          content:
            application/json:
              schema:
                type: array
