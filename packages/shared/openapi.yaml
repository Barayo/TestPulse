openapi: 3.0.3
info:
  title: TestPulse API
  description: >
    The TestPulse REST API. This contract is the single source of truth
    consumed by the web UI (generated TypeScript client), MCP tooling, and
    external integrations.
  version: 0.0.1
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
servers:
  - url: /
    description: Same-origin deployment
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Reports process health only; independent of dependency state.
      tags: [system]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >
        Reports dependency health: database reachable and schema migrations
        current.
      tags: [system]
      responses:
        "200":
          description: Service is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Service metadata
      tags: [system]
      responses:
        "200":
          description: Service name, version, and the publicProjectsEnabled kill switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /api/v1/instance-settings:
    get:
      operationId: getInstanceSettings
      summary: Read instance-wide settings
      description: Tenant-Admin-only.
      tags: [system]
      responses:
        "200":
          description: Current instance settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateInstanceSettings
      summary: Update instance-wide settings
      description: >
        Tenant-Admin-only. A partial update — publicProjectsEnabled
        (enable-public-project-access) and runRetentionDays
        (add-data-retention) may be set independently or together.
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceSettingsUpdate" }
      responses:
        "200":
          description: Updated instance settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/client-errors:
    post:
      operationId: recordClientError
      summary: Report a frontend crash or failed API call for server-side logging
      description: >-
        Pure visibility (add-frontend-error-reporting): the report is logged
        via the server's structured logger, never persisted or surfaced in
        any UI.
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientErrorReport" }
      responses:
        "204": { description: Report logged }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags: [projects]
      responses:
        "200":
          description: All projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/projects/summaries:
    get:
      operationId: listProjectSummaries
      summary: Suite/case counts and latest-run pass rate for every non-archived project, in one request
      tags: [projects]
      responses:
        "200":
          description: One summary per non-archived project
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
  /api/v1/tags:
    get:
      operationId: listTagNames
      summary: >-
        List the full shared project tag vocabulary (add-project-tags), for
        the project list's filter control and the tag picker's autocomplete.
      tags: [projects]
      responses:
        "200":
          description: Every tag name currently in the shared vocabulary
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /api/v1/projects/{projectKey}:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      summary: Rename, describe, or archive a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteProject
      summary: >-
        Permanently delete an already-archived project and everything
        scoped to it. Queues the deletion (hidden from listings
        immediately) and returns before the background purge completes.
      tags: [projects]
      responses:
        "202": { description: Deletion queued; the project is already hidden from listings }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/favorite:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    post:
      operationId: starProject
      summary: Star a project for the calling user
      tags: [projects]
      responses:
        "204": { description: Project is now favorited by the caller }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unstarProject
      summary: Unstar a project for the calling user
      tags: [projects]
      responses:
        "204": { description: Project is no longer favorited by the caller }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/projects/{projectKey}/tags/{tagName}:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
      - { name: tagName, in: path, required: true, schema: { type: string } }
    put:
      operationId: assignProjectTag
      summary: >-
        Assign a tag to a project, creating the shared vocabulary entry if
        it doesn't already exist (case-insensitive reuse).
      tags: [projects]
      responses:
        "204": { description: The project now has this tag assigned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeProjectTag
      summary: >-
        Remove a tag from a project. The tag itself stays in the shared
        vocabulary for reuse, even if this was its last assignment.
      tags: [projects]
      responses:
        "204": { description: The tag is no longer assigned to this project }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/projects/{projectKey}/cases:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCases
      summary: List test cases in a project, cursor-paginated in insertion order
      tags: [cases]
      parameters:
        - name: jiraLinked
          in: query
          required: false
          schema: { type: boolean }
          description: >-
            When true, return only cases with a non-null jiraIssueKey
            (add-jira-connector) — a DB-level filter, not client-side. Not
            itself paginated (always the whole matching set, nextCursor
            always null) — a project's jira-linked cases are inherently a
            small subset.
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of test cases with their current version content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseListPage" }
    post:
      operationId: createCase
      summary: Create a test case (version 1). Defaults into the project's root folder.
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseCreateInput" }
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/projects/{projectKey}/cases/import-csv:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    post:
      operationId: importCasesCSV
      summary: >-
        Bulk-create cases from an uploaded CSV file (add-csv-import-export).
        A CSV column not matching a fixed core header is created as a
        text-type project custom field on first encounter. A row that fails
        validation is skipped and named in the response, never silently
        dropped — the rest of the file still imports.
      tags: [cases]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                folderId:
                  type: string
                  description: Required — the target folder every imported case is created in.
              required: [file, folderId]
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsvImportResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/projects/{projectKey}/cases/export-csv:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: exportCasesCSV
      summary: >-
        Export cases as CSV, in the same column shape import accepts
        (add-csv-import-export) — the whole project, or one folder when
        folderId is given.
      tags: [cases]
      parameters:
        - name: folderId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: CSV file
          content:
            text/csv: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/folders:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFolders
      summary: List folders in a project (flat; reconstruct the tree from parentFolderId), cursor-paginated in insertion order
      tags: [folders]
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of folders, including the project's root folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderListPage" }
    post:
      operationId: createFolder
      summary: Create a subfolder (a parent folder is always required)
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFolder" }
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/folders/{folderId}:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string } }
    put:
      operationId: moveFolder
      summary: >-
        Move (reparent) a folder to a different parent folder
        (add-library-folder-selection, sectionEdit permission). Rejects a
        target that is the folder itself or anywhere in its own subtree, and
        rejects moving the root folder — both as 400, not a 500 or a silent
        no-op.
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentFolderId]
              properties:
                parentFolderId: { type: string }
      responses:
        "200":
          description: The moved folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteFolder
      summary: >-
        Delete a folder (Tenant Admin or sectionDelete permission).
        Cascading soft delete (add-delete-mode): the folder and every folder
        and case anywhere in its subtree are soft-deleted, not reparented.
        The root folder cannot be deleted.
      tags: [folders]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/folders/{folderId}/delete-preview:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string } }
    get:
      operationId: folderDeletePreview
      summary: >-
        Preview how many cases and descendant folders a delete of this
        folder would remove (add-delete-mode) — computed before the
        confirmation dialog opens, not part of the delete response.
      tags: [folders]
      responses:
        "200":
          description: Subtree counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderDeletePreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cases/{caseKey}/folder:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    put:
      operationId: moveCase
      summary: Move a case to a different folder (suite membership is unaffected)
      tags: [cases, folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folderId]
              properties:
                folderId: { type: string }
      responses:
        "204": { description: Moved }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cases/{caseKey}/jira-link:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    put:
      operationId: setCaseJiraLink
      summary: >-
        Set or clear a case's Jira issue key (add-jira-connector) —
        independent of versioned content, never creates a new version.
        Clearing also clears the cached jiraIssueSummary/jiraIssueStatus.
      tags: [cases, jira]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jiraIssueKey]
              properties:
                jiraIssueKey: { type: string, nullable: true }
      responses:
        "200":
          description: The case with its updated Jira link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cases/{caseKey}/jira-sync:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    put:
      operationId: setCaseJiraSync
      summary: >-
        Write the Jira connector's cached issue summary/status for a case
        (add-jira-connector) — requires an existing jiraIssueKey (409
        otherwise); jiraLastSyncedAt is set server-side.
      tags: [cases, jira]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jiraIssueSummary, jiraIssueStatus]
              properties:
                jiraIssueSummary: { type: string }
                jiraIssueStatus: { type: string }
      responses:
        "200":
          description: The case with its updated cached Jira fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cases/{caseKey}:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCase
      summary: Get a case at its current version
      tags: [cases]
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: editCase
      summary: Edit a case (creates a new immutable version)
      tags: [cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseContent" }
      responses:
        "200":
          description: Case at its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteCase
      summary: >-
        Soft-delete a case (Tenant Admin or caseDelete permission) — versions
        stay readable in runs
      tags: [cases]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cases/{caseKey}/versions:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCaseVersions
      summary: Full version history of a case
      tags: [cases]
      responses:
        "200":
          description: All versions, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseVersion" }
  /api/v1/cases/{caseKey}/versions/{version}/restore:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      operationId: restoreCaseVersion
      summary: Restore an old version's content as a new current version
      tags: [cases]
      responses:
        "201":
          description: Case at its new (restored-content) version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/cases/{caseKey}/executions:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
      - name: order
        in: query
        required: false
        schema: { type: string, enum: [recent] }
        description: Omit for the default version-grouped order. "recent" sorts strictly by when each execution occurred, most recent first, and requires `limit`.
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 50 }
        description: Only valid paired with order=recent; caps the number of executions returned.
    get:
      operationId: listCaseExecutions
      summary: Every execution that has pinned this case, across all runs — grouped by version by default, or the most recent N ordered by recency
      tags: [cases]
      responses:
        "200":
          description: Executions ordered by pinned version then time (default), or strictly by recency and capped (order=recent&limit=N)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseExecution" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/cases/{caseKey}/attachments:
    parameters:
      - { name: caseKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCaseAttachments
      summary: A case's reference attachments (images/PDFs), oldest first
      tags: [cases]
      responses:
        "200":
          description: Case attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaseAttachment" }
    post:
      operationId: uploadCaseAttachment
      summary: >-
        Attach a reference file to this case — an image (PNG/JPEG/WebP), a
        PDF document, or a plain-text file (.txt/.log), max 5MB. Belongs to
        the case's identity, not a specific version; survives case edits.
      tags: [cases]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: Created case attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseAttachment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/case-attachments/{attachmentId}:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCaseAttachment
      summary: The raw file bytes for a case attachment
      tags: [cases]
      responses:
        "200":
          description: Case attachment file
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string, format: binary } }
        "304": { description: Not modified (matched If-None-Match) }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCaseAttachment
      summary: Delete a case attachment
      tags: [cases]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectKey}/flaky-cases:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listFlakyCases
      summary: List every currently-flaky case in a project
      tags: [cases]
      responses:
        "200":
          description: Flaky cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlakyCase" }
  /api/v1/projects/{projectKey}/audit:
    parameters:
      - { name: projectKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectActivity
      summary: A project's most recent audited writes, newest first (project-activity-feed)
      description: >-
        Backs the dashboard Activity panel — a bounded teaser, not a full
        paginated history. Only entries for entity types with an owning
        project appear; entries recorded before this endpoint shipped have
        no project association and never appear here (no backfill).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/limit"
