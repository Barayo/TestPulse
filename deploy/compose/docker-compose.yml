# TestPulse evaluation stack.
# From the repository root:  docker compose -f deploy/compose/docker-compose.yml up
# UI + API: http://localhost:8080
name: testpulse

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: testpulse:dev
    ports:
      - "8080:8080"
    environment:
      TESTPULSE_DATABASE_URL: postgres://testpulse:testpulse@db:5432/testpulse
      TESTPULSE_LOG_LEVEL: info
      # Seeds one admin on first startup only (skipped once any user exists —
      # see add-identity-basics design.md); fixed credentials are fine here,
      # this compose file is the local/E2E evaluation stack, not production.
      TESTPULSE_ADMIN_EMAIL: admin@example.com
      TESTPULSE_ADMIN_PASSWORD: correcthorsebatterystaple
      # Defaults match production (5/min, burst 5 — backlog #113); CI's E2E
      # job overrides both via its own shell environment before `docker
      # compose up` so the suite's many legitimate sequential logins don't
      # trip the brute-force limiter, without weakening the default for
      # local dev or any other evaluation use of this compose file.
      TESTPULSE_LOGIN_RATE_LIMIT_PER_MINUTE: ${TESTPULSE_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      TESTPULSE_LOGIN_RATE_LIMIT_BURST: ${TESTPULSE_LOGIN_RATE_LIMIT_BURST:-5}
    depends_on:
      db:
        condition: service_healthy
    # Distroless has no shell/curl; probe the API over TCP from compose's
    # perspective via the db healthcheck + restart policy. Kubernetes gets
    # real HTTP probes from the Helm chart.
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testpulse
      POSTGRES_PASSWORD: testpulse
      POSTGRES_DB: testpulse
    volumes:
      - testpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpulse -d testpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  testpulse-db:
