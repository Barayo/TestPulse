# TestPulse evaluation stack.
# From the repository root:  docker compose -f deploy/compose/docker-compose.yml up
# UI + API: http://localhost:8080
name: testpulse

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: testpulse:dev
    ports:
      - "8080:8080"
    environment:
      TESTPULSE_DATABASE_URL: postgres://testpulse:testpulse@db:5432/testpulse
      TESTPULSE_LOG_LEVEL: info
      # Seeds one admin on first startup only (skipped once any user exists —
      # see add-identity-basics design.md); fixed credentials are fine here,
      # this compose file is the local/E2E evaluation stack, not production.
      TESTPULSE_ADMIN_EMAIL: admin@example.com
      TESTPULSE_ADMIN_PASSWORD: correcthorsebatterystaple
      # Defaults match production (5/min, burst 5 — backlog #113); CI's E2E
      # job overrides both via its own shell environment before `docker
      # compose up` so the suite's many legitimate sequential logins don't
      # trip the brute-force limiter, without weakening the default for
      # local dev or any other evaluation use of this compose file.
      TESTPULSE_LOGIN_RATE_LIMIT_PER_MINUTE: ${TESTPULSE_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      TESTPULSE_LOGIN_RATE_LIMIT_BURST: ${TESTPULSE_LOGIN_RATE_LIMIT_BURST:-5}
      # Mailpit (add-forgot-password): a fake SMTP server, permanently
      # part of this evaluation stack, not an E2E-only override — so
      # passwordResetEnabled is true out of the box for anyone evaluating
      # TestPulse via `docker compose up`, and a developer can watch real
      # emails at Mailpit's own UI (http://localhost:8025) while manually
      # testing the flow. Unauthenticated relay (no username/password) is
      # fine here — this is a fake SMTP server on the compose network, not
      # a real one. The real testpulse.fly.dev deployment uses fly.toml,
      # not this file, and stays unconfigured unless its operator sets it
      # up separately.
      TESTPULSE_SMTP_HOST: mailpit
      TESTPULSE_SMTP_PORT: "1025"
      TESTPULSE_SMTP_FROM_ADDRESS: testpulse@example.com
      TESTPULSE_PUBLIC_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Distroless has no shell/curl; probe the API over TCP from compose's
    # perspective via the db healthcheck + restart policy. Kubernetes gets
    # real HTTP probes from the Helm chart.
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testpulse
      POSTGRES_PASSWORD: testpulse
      POSTGRES_DB: testpulse
    volumes:
      - testpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpulse -d testpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI + REST API (E2E reads sent emails from here)
      - "1025:1025" # SMTP

  # Optional Jira connector (add-jira-connector) — a separate deployable,
  # never part of the `app` image, per establish-architecture's standing
  # decision that connectors are external clients, not in-process plugins.
  # Off by default: only starts with `docker compose --profile jira-connector up`,
  # since most evaluators of this stack have no Jira site to connect to.
  # Needs a scoped TestPulse agent token (create one via the app once it's
  # up) and Jira Cloud API credentials — see docs/integrations.md.
  jira-connector:
    profiles: ["jira-connector"]
    build:
      context: ../../tools/jira-connector
    image: testpulse-jira-connector:dev
    environment:
      # Left as plain ${VAR} substitutions (not the ${VAR:?message} required
      # form): compose validates every service's interpolation at parse
      # time regardless of active profiles, so a required-var form here
      # would break plain `docker compose up` for everyone, not just Jira
      # users. An unset value comes through empty and the connector's own
      # config.Load fails fast, naming the specific missing variable.
      TESTPULSE_URL: http://app:8080
      TESTPULSE_JIRA_AGENT_TOKEN: ${TESTPULSE_JIRA_AGENT_TOKEN:-}
      TESTPULSE_JIRA_BASE_URL: ${TESTPULSE_JIRA_BASE_URL:-}
      TESTPULSE_JIRA_EMAIL: ${TESTPULSE_JIRA_EMAIL:-}
      TESTPULSE_JIRA_API_TOKEN: ${TESTPULSE_JIRA_API_TOKEN:-}
    depends_on:
      app:
        condition: service_started

  # Optional TestRail importer (add-testrail-importer) — a separate
  # deployable, never part of the `app` image, per the same standing
  # decision as jira-connector above. Off by default: only starts with
  # `docker compose --profile import-connector up`. Unlike jira-connector,
  # it holds no third-party credentials in its own config — the TestRail
  # site URL/email/API key (or, for Qase, an API token/project code; or,
  # for Zephyr Scale, an API token/project key; or, for Kiwi TCMS, a site
  # URL/username/password/product; or, for Xray, a mode plus either a
  # Cloud client ID/secret/project ID or a Server/DC site URL/Personal
  # Access Token/project key; or, for Tuskr, a tenant ID/Personal Access
  # Token/project ID) are entered once in the browser
  # (+ New project → Import from TestRail/Qase/Zephyr Scale/Kiwi TCMS/Xray/Tuskr)
  # and travel to the importer per-job, encrypted at rest — see
  # docs/integrations.md. `--source=testrail` below is this service's
  # default; override it per run for a different vendor, e.g.
  # `docker compose --profile import-connector run import-connector --source=qase`
  # or `--source=zephyr-scale` or `--source=kiwi-tcms` or `--source=xray`
  # or `--source=tuskr`.
  import-connector:
    profiles: ["import-connector"]
    build:
      context: ../../tools/import-connector
    image: testpulse-import-connector:dev
    command: ["--source=testrail"]
    environment:
      TESTPULSE_URL: http://app:8080
      TESTPULSE_AGENT_TOKEN: ${TESTPULSE_AGENT_TOKEN:-}
    depends_on:
      app:
        condition: service_started

volumes:
  testpulse-db:
