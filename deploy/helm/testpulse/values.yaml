# Default values for the TestPulse chart.

image:
  repository: ghcr.io/barayo/testpulse
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: testpulse.local
  annotations: {}
  tls: []

app:
  logLevel: info
  # Extra environment variables for the app container.
  extraEnv: []

# Bundled PostgreSQL for evaluation. Disable it and set externalDatabase for
# production deployments.
postgresql:
  enabled: true
  image: postgres:16-alpine
  database: testpulse
  username: testpulse
  # For evaluation only — override or use existingSecret in real deployments.
  password: testpulse
  # Name of an existing Secret with a "password" key; takes precedence over
  # the inline password above.
  existingSecret: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# Used when postgresql.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  database: testpulse
  username: testpulse
  password: ""
  # Name of an existing Secret with a "password" key; takes precedence over
  # the inline password above.
  existingSecret: ""
  sslMode: require

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Optional Jira connector (add-jira-connector) — a separate Deployment from
# the main app, per establish-architecture's standing decision that
# connectors are external clients, not in-process plugins. Disabled by
# default; most installs have no Jira site to connect to.
jiraConnector:
  enabled: false
  image:
    repository: ghcr.io/barayo/testpulse-jira-connector
    tag: ""            # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  syncInterval: 5m
  jiraBaseUrl: ""      # e.g. https://mycompany.atlassian.net — keep this in
                       # sync with the same-named Instance Settings field,
                       # which is separate (the connector's own API calls
                       # vs. the UI's browsable links).
  jiraEmail: ""
  # For evaluation only — prefer existingSecret for a real deployment, since
  # this file may be checked into version control.
  jiraApiToken: ""
  agentToken: ""       # a scoped TestPulse agent token, created via the app
  # Name of an existing Secret with "jiraApiToken"/"agentToken" keys; takes
  # precedence over the inline values above.
  existingSecret: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# Optional structural project importer (add-testrail-importer,
# add-qase-importer, add-zephyr-scale-importer, add-kiwi-tcms-importer,
# add-xray-importer) — a separate Deployment, per the same standing
# decision as jiraConnector above. Disabled by default. Unlike
# jiraConnector, it holds no third-party (TestRail/Qase/Zephyr
# Scale/Kiwi TCMS/Xray) credentials in its own config at all — those are
# entered once in the browser and travel to the importer per-job,
# encrypted at rest; see docs/integrations.md.
importConnector:
  enabled: false
  image:
    repository: ghcr.io/barayo/testpulse-import-connector
    tag: ""              # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  source: testrail        # --source flag value: "testrail", "qase",
                          # "zephyr-scale", "kiwi-tcms", or "xray" today
  pollInterval: 5s
  # For evaluation only — prefer existingSecret for a real deployment, since
  # this file may be checked into version control.
  agentToken: ""          # a project-scoped TestPulse agent token, created via the app
  # Name of an existing Secret with an "agentToken" key; takes precedence
  # over the inline value above.
  existingSecret: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
