{{- $needsSecret := or (and .Values.postgresql.enabled (not .Values.postgresql.existingSecret)) (and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret)) -}}
{{- if $needsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "testpulse.fullname" . }}-db
  labels:
    {{- include "testpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  password: {{ .Values.postgresql.password | quote }}
  {{- else }}
  password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required when postgresql.enabled is false" .Values.externalDatabase.password | quote }}
  {{- end }}
{{- end }}
