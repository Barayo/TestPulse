{{- if and .Values.importConnector.enabled (not .Values.importConnector.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "testpulse.importConnectorSecretName" . }}
  labels:
    {{- include "testpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  agentToken: {{ required "importConnector.agentToken or importConnector.existingSecret is required when importConnector.enabled is true" .Values.importConnector.agentToken | quote }}
{{- end }}
