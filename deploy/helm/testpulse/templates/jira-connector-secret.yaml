{{- if and .Values.jiraConnector.enabled (not .Values.jiraConnector.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "testpulse.jiraConnectorSecretName" . }}
  labels:
    {{- include "testpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  jiraApiToken: {{ required "jiraConnector.jiraApiToken or jiraConnector.existingSecret is required when jiraConnector.enabled is true" .Values.jiraConnector.jiraApiToken | quote }}
  agentToken: {{ required "jiraConnector.agentToken or jiraConnector.existingSecret is required when jiraConnector.enabled is true" .Values.jiraConnector.agentToken | quote }}
{{- end }}
