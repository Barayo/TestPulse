name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push multi-arch image
    runs-on: [self-hosted, testpulse]
    env:
      # This self-hosted runner is a macOS LaunchAgent — Docker Desktop's own
      # backend requires an interactive keychain/GUI session the LaunchAgent
      # doesn't have, and that held true even after isolating DOCKER_CONFIG
      # and disabling Desktop's credential-helper setting: Desktop still
      # gated even fully anonymous pulls (setup-qemu-action's binfmt image)
      # on the locked keychain. Colima is a plain Linux VM behind the docker
      # CLI with no GUI/keychain layer in the loop at all, so this class of
      # failure can't recur (switch-runner-docker-to-colima). DOCKER_CONFIG
      # still isolates credentials to a plain file, mainly so this job's
      # GHCR login doesn't write into the shared user docker config.
      DOCKER_HOST: unix:///Users/migalons/.colima/default/docker.sock
      DOCKER_CONFIG: /Users/migalons/actions-runner-testpulse/.docker-config
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify manifest lists both architectures
        run: |
          tag="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          docker buildx imagetools inspect "$tag" | tee manifest.txt
          grep -q "linux/amd64" manifest.txt
          grep -q "linux/arm64" manifest.txt
