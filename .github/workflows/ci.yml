name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR/branch supersedes the previous one — no reason to
# let both finish and pay for both (reduce-ci-actions-usage).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Feeds helm/migrations below, the two jobs cheap enough to skip outright
  # when their own files didn't change (reduce-ci-actions-usage) — api/web/e2e
  # stay unconditional on path, since app code can affect either indirectly.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      helm: ${{ steps.filter.outputs.helm }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            helm:
              - 'deploy/helm/**'
            migrations:
              - 'apps/api/internal/db/migrations/**'

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    # A push to main was already validated by the PR that merged it —
    # re-running here would just spend minutes confirming the same commit
    # again (reduce-ci-actions-usage). e2e is the one exception: it also
    # reports results to the dogfood instance on main, so it keeps running
    # on both triggers.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TESTPULSE_TEST_DATABASE_URL: postgres://test:test@localhost:5433/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: apps/api
      - name: Test with coverage gate (unit + db integration)
        run: |
          go test -coverprofile=coverage.out -coverpkg=./internal/... ./internal/...
          go test ./cmd/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "internal coverage: ${total}% (minimum 80%)"
          awk "BEGIN {exit !(${total} >= 80)}"

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Contract types are current
        run: |
          npm -w @testpulse/shared run generate
          git diff --exit-code packages/shared/src
      - name: Lint
        run: npm -w web run lint
      - name: Typecheck
        run: npm -w web run typecheck
      - name: Unit tests with coverage thresholds
        run: npm -w web run test:coverage
      - name: Build
        run: npm -w web run build

  e2e:
    name: E2E (Playwright vs compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx --workspace=web playwright install --with-deps chromium
      - name: Start compose stack
        # The suite runs single-worker/sequential and logs in as a fresh
        # user in most RBAC/teams/permission scenarios — well over the
        # production login rate limit (5/min, burst 5, backlog #113) in a
        # normal ~4-minute run. Raise it for this job only; the compose
        # file's own default (used by local dev / evaluation) stays strict.
        run: docker compose -f deploy/compose/docker-compose.yml up --build -d --wait
        env:
          TESTPULSE_LOGIN_RATE_LIMIT_PER_MINUTE: "600"
          TESTPULSE_LOGIN_RATE_LIMIT_BURST: "100"
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/readyz && exit 0 || sleep 2
          done
          echo "stack never became ready"; docker compose -f deploy/compose/docker-compose.yml logs; exit 1
      - name: Run E2E suite
        run: npm -w web run e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
      - name: Report results to dogfood instance
        # Dogfooding (ROADMAP.md v0.1): TestPulse's own e2e suite reports
        # into a live TestPulse project. main only — PR branches would
        # otherwise flood the dogfood project with noise, and forked PRs
        # don't get repo secrets anyway. always() so real failures land
        # too, not just green runs.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          name="main @ ${COMMIT_SHA:0:7} — $(printf '%s' "$COMMIT_MSG" | head -1)"
          curl -sS -X POST https://testpulse.fly.dev/api/v1/projects/TD/imports \
            -H "Authorization: Bearer ${{ secrets.TESTPULSE_DOGFOOD_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --rawfile report apps/web/e2e-results.xml --arg name "$name" '{format: "junit-xml", report: $report, name: $name}')"

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Lint chart
        run: helm lint deploy/helm/testpulse
      - name: Render (bundled DB)
        run: helm template tp deploy/helm/testpulse > /dev/null
      - name: Render (external DB)
        run: >
          helm template tp deploy/helm/testpulse
          --set postgresql.enabled=false
          --set externalDatabase.host=pg.example.com
          --set externalDatabase.password=ci
          > /dev/null

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: All commits are signed off
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done < <(git rev-list --no-merges "$range")
          exit $missing

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No already-merged migration file was edited
        # goose tracks applied migrations by version number, not content — a
        # deployed, already-migrated database (testpulse.fly.dev) silently
        # skips an edited-in-place file instead of re-running it, so its
        # schema drifts from what the code expects. This turned into a real
        # production outage once (2026-07-25: link-runs-to-suite amended
        # 00002_core_domain.sql, which testpulse.fly.dev had already passed,
        # and broke run creation/listing site-wide). A migration file, once
        # it exists on main, must never change again — add a new one instead.
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against (first push to a new ref) — skipping."
            exit 0
          fi
          changed=$(git diff --name-status "$base" HEAD -- apps/api/internal/db/migrations/ | awk '$1 == "M" {print $2}')
          if [ -n "$changed" ]; then
            echo "::error::Migration file(s) already on main were edited instead of adding a new file:"
            echo "$changed"
            echo "Add a new NNNNN_*.sql migration instead — see CLAUDE.md's migration policy."
            exit 1
          fi
